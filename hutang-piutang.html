<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hutang Piutang</title>

<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --primary: #2563eb;
    --danger: #dc2626;
    --success: #16a34a;
    --text: #1f2937;
    --muted: #6b7280;
    --radius: 14px;
  }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .container {
    max-width: 420px;
    margin: auto;
    padding: 16px;
  }

  h1 {
    text-align: center;
    font-size: 20px;
    margin-bottom: 16px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    margin-bottom: 16px;
  }

  label {
    font-size: 13px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }

  input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    font-size: 14px;
    margin-bottom: 14px;
    box-sizing: border-box;
  }

  button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--primary);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .item {
    background: #f9fafb;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    border-left: 5px solid var(--primary);
  }

  .item small {
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }

  .amount {
    font-weight: 700;
  }

  .saldo {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
  }

  .plus { color: var(--success); }
  .minus { color: var(--danger); }
</style>
</head>

<body>
<div class="container">
  <h1>📒 Hutang Piutang</h1>

  <!-- FORM -->
  <div class="card">
    <label>Tanggal</label>
    <input type="date" id="tanggal"/>

    <label>Debitur (Yang Berutang)</label>
    <select id="debitur">
      <option value="">Pilih</option>
      <option>Heri</option>
      <option>Fajrin</option>
      <option>Rupaloka</option>
    </select>

    <label>Kreditur (Yang Memberi)</label>
    <select id="kreditur">
      <option value="">Pilih</option>
      <option>Heri</option>
      <option>Fajrin</option>
      <option>Rupaloka</option>
    </select>

    <label>Jumlah</label>
    <input type="number" id="jumlah" placeholder="Contoh: 500000"/>

    <button onclick="simpan()">Simpan Transaksi</button>
  </div>

  <!-- SALDO -->
  <div class="card">
    <h3>Saldo</h3>
    <div id="saldo"></div>
  </div>

  <!-- RIWAYAT -->
  <div class="card">
    <h3>Riwayat Transaksi</h3>
    <div id="list"></div>
  </div>
</div>

<script>
  const listEl = document.getElementById("list");
  const saldoEl = document.getElementById("saldo");
  const orang = ["Heri", "Fajrin", "Rupaloka"];

  function rupiah(n) {
    return "Rp " + Number(n).toLocaleString("id-ID");
  }

  function simpan() {
    const data = {
      tanggal: tanggal.value,
      debitur: debitur.value,
      kreditur: kreditur.value,
      jumlah: Number(jumlah.value)
    };

    if (!data.tanggal || !data.debitur || !data.kreditur || !data.jumlah) {
      alert("Lengkapi semua field");
      return;
    }

    if (data.debitur === data.kreditur) {
      alert("Debitur dan Kreditur tidak boleh sama");
      return;
    }

    const db = JSON.parse(localStorage.getItem("hutangPiutang") || "[]");
    db.unshift(data);
    localStorage.setItem("hutangPiutang", JSON.stringify(db));

    document.querySelectorAll("input, select").forEach(e => e.value = "");
    render();
  }

  function hitungSaldo(data) {
    const saldo = { Heri: 0, Fajrin: 0, Rupaloka: 0 };

    data.forEach(t => {
      saldo[t.debitur] -= t.jumlah;
      saldo[t.kreditur] += t.jumlah;
    });

    return saldo;
  }

  function render() {
    const data = JSON.parse(localStorage.getItem("hutangPiutang") || "[]");

    // Render saldo
    const saldo = hitungSaldo(data);
    saldoEl.innerHTML = "";
    orang.forEach(o => {
      const div = document.createElement("div");
      div.className = "saldo";
      div.innerHTML = `
        <span>${o}</span>
        <span class="${saldo[o] >= 0 ? "plus" : "minus"}">
          ${rupiah(saldo[o])}
        </span>
      `;
      saldoEl.appendChild(div);
    });

    // Render list
    listEl.innerHTML = "";
    data.forEach(t => {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <small>${t.tanggal}</small>
        <div>${t.debitur} berutang ke ${t.kreditur}</div>
        <div class="amount">${rupiah(t.jumlah)}</div>
      `;
      listEl.appendChild(div);
    });
  }

  render();
</script>
</body>
</html>
